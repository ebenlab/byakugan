<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byakugan</title>
<link rel="icon" type="image/svg+xml" href="/__byakugan/favicon.svg">
<link rel="stylesheet" href="/__byakugan/app.css">
<script>
// Apply a saved explicit theme before first paint to avoid a flash.
(function () {
  try {
    var t = localStorage.getItem('bk-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-bk-theme', t);
  } catch (_) { /* storage unavailable: stay on auto */ }
})();
</script>
</head>
<body class="bk-landing">
<header class="bk-header">
  <a class="bk-logo" href="/"><span class="bk-eye"><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><ellipse cx="16" cy="16" rx="14" ry="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4.5" fill="currentColor"/></svg></span> Byakugan</a>
  <input id="bk-search" class="bk-search" type="search"
         placeholder="Search titles, headings, content…  ( / )" autocomplete="off">
  <span class="bk-meta" id="bk-meta"></span>
  <button id="bk-theme" class="bk-theme-btn" type="button"></button>
</header>
<main class="bk-main">
  <div id="bk-results" class="bk-results" hidden></div>
  <div id="bk-projects" class="bk-projects"></div>
  <p id="bk-empty" class="bk-empty" hidden>
    No HTML documents found here yet. Point an agent at this folder and refresh —
    or run <code>byakugan &lt;folder&gt;</code> on a folder that has some.
  </p>
</main>
<script src="/__byakugan/search.js"></script>
<script src="/__byakugan/app.js"></script>
</body>
</html>
